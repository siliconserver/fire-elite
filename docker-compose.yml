services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Alle Datenbankdateien liegen dauerhaft im Projektordner unter ./data
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Fertiges Image aus der GitHub Container Registry (`docker compose pull`),
    # oder lokal bauen mit `docker compose up -d --build`. Version über ELITE_TAG in .env.
    image: ghcr.io/siliconserver/fire-elite:${ELITE_TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SIGNAL_API_URL: ${SIGNAL_API_URL:-}
      SIGNAL_NUMBER: ${SIGNAL_NUMBER:-}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-49}
    volumes:
      # DB-Dumps landen dauerhaft im Projektordner unter ./data/backups
      - ./data/backups:/data/backups
    ports:
      - "8086:8000"

  # Optional: Versand per Signal. Startet nur mit `docker compose --profile signal up -d`.
  signal:
    image: bbernhard/signal-cli-rest-api:latest
    profiles: ["signal"]
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      # Signal-Konto (Schlüssel) dauerhaft im Projektordner
      - ./data/signal:/home/.local/share/signal-cli
    ports:
      # nur lokal erreichbar, für das einmalige Verknüpfen per QR-Code
      - "127.0.0.1:8087:8080"
